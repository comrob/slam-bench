[tool.poetry]
name = "slam-dataset-tools"
version = "0.1.0"
description = "Dataset preparation tools for SLAM benchmarking"
authors = ["CTU Computational Robotics Lab"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
mcap = "^1.3.1"
mcap-ros2-support = "^0.5.7"
pyproj = "^3.7.0"
numpy = "^1.24.0"

[tool.poetry.scripts]
extract-gps = "extract_gps_trajectory:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
